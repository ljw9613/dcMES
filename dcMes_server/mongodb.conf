#启用日志文件，默认启用
journal=true

#这个选项可以过滤掉一些无用的日志信息，若需要调试使用请设置为false
quiet=false

# 日志文件位置
logpath=D:/BtSoft/mongodb/logs/mongodb.log

# 以追加方式写入日志
logappend=true

# 轮转时重命名旧文件，新日志写新文件，避免单文件无限变大
logRotate=rename


#绑定ip,默认禁用外网
bind_ip = 0.0.0.0

# 默认27017
port = 27017

# 数据库文件位置
dbpath = D:/BtSoft/mongodb/data

# 启用定期记录CPU利用率和 I/O 等待
#cpu = true

# 是否以安全认证方式运行，默认是不认证的非安全方式
auth = true
#noauth = true

# 详细记录输出
#verbose = true
# Inspect all client data for validity on receipt (useful for
# developing drivers)用于开发驱动程序时验证客户端请求
#objcheck = true
# Enable db quota management

# 启用数据库配额管理
#quota = true

# 设置oplog记录等级
# Set oplogging level where n is
#   0=off (default)
#   1=W
#   2=R
#   3=both
#   7=W+some reads
#diaglog=0

# Diagnostic/debugging option 动态调试项
#nocursors = true

# Ignore query hints 忽略查询提示
#nohints = true

# 禁用http界面，默认为localhost：28017

#nohttpinterface = true
# 关闭服务器端脚本，这将极大的限制功能

# Turns off server-side scripting.  This will result in greatly limited
# functionality
#noscripting = true

# 关闭扫描表，任何查询将会是扫描失败
# Turns off table scans.  Any query that would do a table scan fails.
#notablescan = true

# 关闭数据文件预分配
# Disable data file preallocation.
#noprealloc = true

# 为新数据库指定.ns文件的大小，单位:MB
# Specify .ns file size for new databases.
# nssize = 
# Replication Options 复制选项
# in replicated mongo databases, specify the replica set name here
#replSet=setname
# maximum size in megabytes for replication operation log
#oplogSize=1024
# path to a key file storing authentication info for connections
# between replica set members

#指定存储身份验证信息的密钥文件的路径
#keyFile=/path/to/keyfile


# ================================================================
# 防止 MongoDB 被拖死的保护性配置
# 服务器规格：64核 / 128GB RAM
# ================================================================

# ─── 连接数限制 ─────────────────────────────────────────────────
# 最大并发连接数，防止连接风暴耗尽系统资源
# Node.js 4实例 × maxPoolSize(50) = 200，500 留余量给监控/备份/DBA
maxConns=500

# ─── WiredTiger 缓存 ────────────────────────────────────────────
# cacheSizeGB = RAM × 50% - 1GB = 128 × 50% - 1 = 63，保守取 60
# 原默认值约 4GB，严重偏低，是查询慢、内存 swap 的主要原因
wiredTigerCacheSizeGB=60

# ─── 慢查询记录 ──────────────────────────────────────────────────
# 超过 3000ms 记录为慢查询，写入 system.profile
# 排查：db.system.profile.find().sort({ts:-1}).limit(10).pretty()
slowms=3000
profile=1

# ─── setParameter 防死锁 / 防挂起 ───────────────────────────────
# 事务等锁超时 5 秒，避免事务互相死锁导致服务挂起
setParameter=maxTransactionLockRequestTimeoutMillis=5000

# 游标空闲超过 10 分钟自动销毁，防止僵尸游标堆积耗内存
setParameter=cursorTimeoutMillis=600000

# ─── 注意：以下参数需在 mongo shell 启动后手动执行一次 ────────────
# 控制 WiredTiger 并发读写事务数，防止过多并发把 IO 打满
#   db.adminCommand({ setParameter: 1, wiredTigerConcurrentReadTransactions: 256 })
#   db.adminCommand({ setParameter: 1, wiredTigerConcurrentWriteTransactions: 128 })
# ─────────────────────────────────────────────────────────────────
